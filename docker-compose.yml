version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: dental_clinic_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dental_clinic_db
      MYSQL_USER: dental_user
      MYSQL_PASSWORD: dental123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/dental_clinic.sql:/docker-entrypoint-initdb.d/dental_clinic.sql
    networks:
      - dental_network

  # Web Application
  webapp:
    build: .
    container_name: dental_clinic_web
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=dental_clinic_db
      - DB_USER=dental_user
      - DB_PASSWORD=dental123
    networks:
      - dental_network

volumes:
  mysql_data:

networks:
  dental_network:
    driver: bridge 